<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SportHub Pro - Deportes en Directo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-card: #141416;
      --bg-card-hover: #1a1b1f;
      --bg-header: #000000;
      --border-color: #262626;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --text-muted: #737373;
      --gold: #f59e0b;
    }

    body { background-color: var(--bg-main); color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    /* Header */
    .sh-header { background: var(--bg-header); border-bottom: 2px solid var(--accent-blue); }
    .nav-link { color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; transition: color 0.2s; }
    .nav-link:hover { color: #60a5fa; }

    /* Contenedores */
    .tr-box { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; }
    .tr-row { border-bottom: 1px solid var(--border-color); transition: background-color 0.2s; }
    .tr-row:hover { background-color: var(--bg-card-hover); }
    .tr-row:last-child { border-bottom: none; }

    /* Buscador y Píldoras */
    .search-input { background-color: #1a1a1c; border: 1px solid #333; color: #fff; width: 100%; border-radius: 6px; }
    .search-input:focus { outline: none; border-color: var(--accent-blue); }
    
    .pill { background-color: #1a1a1c; color: #a3a3a3; border: 1px solid #333; border-radius: 9999px; padding: 6px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .pill:hover { background-color: #262626; color: #fff; }
    .pill.active { background-color: var(--accent-blue); border-color: var(--accent-blue); color: #fff; font-weight: 700; }

    /* Elementos del Partido (Réplica exacta de la captura) */
    .time-box { background-color: #1a1a1c; border: 1px solid #333; border-radius: 6px; padding: 8px 0; text-align: center; width: 65px; flex-shrink: 0; }
    .time-val { color: var(--gold); font-size: 15px; font-weight: 800; }
    .time-sub { color: var(--text-muted); font-size: 10px; margin-top: 2px; }
    
    .live-box { background-color: #dc2626; border-radius: 6px; padding: 8px 0; text-align: center; width: 65px; flex-shrink: 0; box-shadow: 0 0 10px rgba(220, 38, 38, 0.3); }
    .live-val { color: #fff; font-size: 12px; font-weight: 900; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
    .live-dot { width: 6px; height: 6px; background-color: #fff; border-radius: 50%; margin-bottom: 2px; animation: pulse 1.5s infinite; }

    .vs-box { background-color: #333; color: var(--gold); font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; margin: 0 8px; }

    /* Botones Derechos */
    .btn-canales { background-color: #1a1a1c; border: 1px solid #333; color: #e5e5e5; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 4px; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-canales:hover { background-color: #262626; color: #fff; }
    
    .btn-play { background-color: var(--accent-blue); color: #fff; font-size: 12px; font-weight: 700; padding: 7px 16px; border-radius: 4px; transition: background-color 0.2s; }
    .btn-play:hover { background-color: var(--accent-blue-hover); }

    /* Acordeón Canales */
    .channel-link { background-color: #1a1a1c; border: 1px solid #333; color: #fff; font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 4px; display: inline-flex; align-items: center; gap: 8px; transition: background-color 0.2s; }
    .channel-link:hover { background-color: #262626; }
    .lang-badge { background-color: var(--gold); color: #000; font-size: 9px; font-weight: 900; padding: 1px 4px; border-radius: 2px; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent-blue); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header Superior -->
  <header class="sh-header sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2 font-black text-2xl text-white cursor-pointer" onclick="fetchAgenda()">
        <span class="bg-blue-600 text-white px-2 py-0.5 rounded text-sm shadow">LIVE</span>
        <span>SPORTHUB</span>
      </div>
      
      <nav class="hidden md:flex items-center gap-6">
        <a href="#" class="nav-link text-blue-500">PROGRAMACIÓN</a>
        <a href="#" class="nav-link">PARTIDOS DE HOY</a>
        <a href="#" class="nav-link">CANALES TV</a>
        <a href="#" class="nav-link">GUÍA & FAQ</a>
      </nav>

      <div class="flex items-center gap-3">
        <span id="clock-spain" class="text-xs font-mono text-gray-400">CET: --:--</span>
        <button onclick="fetchAgenda()" class="text-gray-400 hover:text-white" title="Recargar Agenda">↻</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto w-full flex-1 p-3 md:p-5 flex flex-col gap-4">

    <!-- Reproductor de Video -->
    <section id="player-wrapper" class="w-full bg-black rounded-lg overflow-hidden border border-gray-800 shadow-2xl hidden">
      <div class="bg-[#141416] px-4 py-3 border-b border-gray-800 flex justify-between items-center">
        <div>
          <h2 id="player-title" class="text-sm font-bold text-white">Cargando...</h2>
          <p class="text-[10px] text-blue-400 uppercase">Emisión en Directo</p>
        </div>
        <button onclick="toggleFullscreen()" class="btn-play text-[11px] flex items-center gap-1.5">
          📺 Pantalla Completa
        </button>
      </div>
      <div id="player-container" class="relative w-full aspect-video bg-black flex items-center justify-center">
        <iframe id="iframe-player" class="w-full h-full hidden" frameborder="0" allowfullscreen></iframe>
        <div id="loading-spinner" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center">
          <div class="spinner mb-3"></div>
          <p class="text-white text-xs font-medium">Conectando señal...</p>
        </div>
      </div>
      <button onclick="closePlayer()" class="w-full bg-[#141416] text-gray-400 hover:text-white py-2 text-xs transition">Cerrar Reproductor</button>
    </section>

    <!-- Buscador y Píldoras -->
    <section class="tr-box p-4 flex flex-col gap-4">
      <input type="text" id="search-input" oninput="renderMatches()" placeholder="🔍 Buscar partido, equipo o competición..." class="search-input px-4 py-3 text-sm">
      <div class="flex flex-wrap gap-2">
        <button onclick="filterSport('ALL', this)" class="pill active">⭐ Todos</button>
        <button onclick="filterSport('FÚTBOL', this)" class="pill">⚽ Fútbol</button>
        <button onclick="filterSport('BALONCESTO', this)" class="pill">🏀 Baloncesto</button>
        <button onclick="filterSport('HOCKEY', this)" class="pill">🏒 Hockey</button>
        <button onclick="filterSport('AMERICANO', this)" class="pill">🏈 NFL</button>
        <button onclick="filterSport('BÉISBOL', this)" class="pill">⚾ MLB</button>
        <button onclick="filterSport('MOTOR', this)" class="pill">🏎️ Motor</button>
      </div>
    </section>

    <!-- Lista de Partidos -->
    <section class="flex flex-col gap-0">
      <!-- Encabezado de Lista -->
      <div class="tr-box rounded-b-none border-b-0 px-4 py-3 flex justify-between items-center relative overflow-hidden">
        <!-- Línea decorativa superior -->
        <div class="absolute top-0 left-0 w-full h-[2px] bg-blue-600"></div>
        <h3 class="text-[13px] font-bold text-blue-500">» Programación de Hoy en SportHub</h3>
        <span id="match-counter" class="bg-[#1a1a1c] border border-[#333] text-gray-300 text-[11px] px-3 py-1 rounded-full font-bold">Cargando...</span>
      </div>

      <!-- Contenedor de filas -->
      <div id="matches-list" class="tr-box rounded-t-none flex flex-col">
        <div class="text-sm text-gray-500 text-center py-20 flex flex-col items-center">
          <div class="spinner mb-4 border-gray-500 border-top-gray-300"></div>
          Obteniendo programación...
        </div>
      </div>
    </section>

  </main>

  <footer class="bg-[#050505] border-t border-[#1a1a1c] py-4 text-center text-xs text-gray-600 mt-8">
    SportHub Pro &copy; 2026 - Emisión en Directo
  </footer>

  <script>
    let allMatches = [];
    let currentSport = 'ALL';

    const BACKEND_URL = 'https://sporthub-backend-xhxz.onrender.com';

    document.addEventListener('DOMContentLoaded', () => {
      updateSpainClock();
      setInterval(updateSpainClock, 60000);
      fetchAgenda();
    });

    function updateSpainClock() {
      const now = new Date();
      document.getElementById('clock-spain').textContent = `CET: ${new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit' }).format(now)}`;
    }

    async function fetchAgenda() {
      const container = document.getElementById('matches-list');
      try {
        const res = await fetch(`${BACKEND_URL}/api/agenda`);
        const data = await res.json();
        if (data.success && data.events.length > 0) {
            allMatches = data.events;
            renderMatches();
        } else {
            throw new Error("No events");
        }
      } catch (e) {
        container.innerHTML = '<div class="text-sm text-red-400 text-center py-20">Error de conexión. Reintentando en breve...</div>';
      }
    }

    function filterSport(category, btn) {
      currentSport = category;
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById('matches-list');
      const counter = document.getElementById('match-counter');
      const query = document.getElementById('search-input').value.trim().toLowerCase();

      let filtered = allMatches;
      if (currentSport !== 'ALL') filtered = filtered.filter(m => m.sport === currentSport);
      if (query) filtered = filtered.filter(m => m.strEvent.toLowerCase().includes(query));

      counter.textContent = `${filtered.length} Partidos Disponibles`;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-sm text-gray-500 text-center py-20">No hay eventos para mostrar.</div>';
        return;
      }

      const today = new Date();
      const dateStr = `${today.getDate()}/${today.getMonth() + 1}`;

      filtered.forEach((m) => {
        const row = document.createElement('div');
        row.className = 'tr-row p-3 flex flex-col w-full';

        const isLive = m.strTime === 'EN VIVO';
        const timeElement = isLive 
          ? `<div class="live-box"><div class="live-val"><div class="live-dot"></div>EN<br>VIVO</div></div><div class="time-sub text-center w-[65px]">Local • ${dateStr}</div>`
          : `<div class="time-box"><div class="time-val">${m.strTime}</div></div><div class="time-sub text-center w-[65px]">Local • ${dateStr}</div>`;

        // Generar título con VS
        let eventHtml = m.strEvent;
        if (m.strEvent.toUpperCase().includes(' VS ')) {
            const parts = m.strEvent.split(/ VS /i);
            eventHtml = `<span class="text-white font-bold text-[13px]">${escapeHTML(parts[0].trim())}</span><span class="vs-box">VS</span><span class="text-white font-bold text-[13px]">${escapeHTML(parts[1].trim())}</span>`;
        } else {
            eventHtml = `<span class="text-white font-bold text-[13px]">${escapeHTML(m.strEvent)}</span>`;
        }

        let channelsHtml = '';
        if (m.options && m.options.length > 0) {
            channelsHtml = m.options.map(opt => `
                <button onclick="playStream('${escapeQuotes(m.strEvent)}', '${escapeQuotes(opt.url)}')" class="channel-link">
                    <span>▶ ${escapeHTML(opt.name)}</span>
                    <span class="lang-badge">${opt.lang}</span>
                </button>
            `).join('');
        }

        row.innerHTML = `
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center w-full gap-4">
            <div class="flex items-center gap-4 min-w-0 flex-1">
              <div class="flex flex-col items-center shrink-0">
                ${timeElement}
              </div>
              
              <div class="min-w-0 flex-1">
                <div class="text-[10px] font-bold text-blue-500 uppercase tracking-wide mb-1">${escapeHTML(m.sport)}</div>
                <div class="flex items-center flex-wrap truncate">
                  ${eventHtml}
                </div>
              </div>
            </div>

            <div class="flex items-center gap-2 shrink-0 self-end md:self-auto">
              <button onclick="toggleChannels('${m.idEvent}')" class="btn-canales">
                Canales <span id="arrow-${m.idEvent}" class="text-[10px] ml-1">►</span>
              </button>
              <button onclick="playStream('${escapeQuotes(m.strEvent)}', '${escapeQuotes(m.options[0]?.url || '')}')" class="btn-play">
                Ver en Vivo
              </button>
            </div>
          </div>

          <div id="channels-${m.idEvent}" class="hidden mt-4 pt-3 border-t border-[#262626] w-full">
            <div class="flex justify-between items-center text-[10px] font-bold uppercase mb-3">
              <span class="text-gray-400">CANALES Y ENLACES OFICIALES:</span>
              <span class="text-gray-500">EMISIÓN EN DIRECTO</span>
            </div>
            <div class="flex flex-wrap gap-2">
              ${channelsHtml}
            </div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function toggleChannels(id) {
      const el = document.getElementById(`channels-${id}`);
      const arrow = document.getElementById(`arrow-${id}`);
      if (el) {
        if (el.classList.contains('hidden')) {
          el.classList.remove('hidden');
          arrow.textContent = '▼';
        } else {
          el.classList.add('hidden');
          arrow.textContent = '►';
        }
      }
    }

    function playStream(title, url) {
      if(!url) return;
      document.getElementById('player-title').textContent = title;
      const wrapper = document.getElementById('player-wrapper');
      const iframe = document.getElementById('iframe-player');
      const spinner = document.getElementById('loading-spinner');

      wrapper.classList.remove('hidden');
      spinner.classList.remove('hidden');
      iframe.classList.add('hidden');

      wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });

      const proxyUrl = `${BACKEND_URL}/api/proxy?url=${encodeURIComponent(url)}`;
      
      iframe.onload = () => { 
        spinner.classList.add('hidden');
        iframe.classList.remove('hidden');
      };
      iframe.src = proxyUrl;
    }

    function closePlayer() {
      document.getElementById('player-wrapper').classList.add('hidden');
      document.getElementById('iframe-player').src = '';
    }

    function toggleFullscreen() {
      const container = document.getElementById('player-container');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function escapeHTML(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function escapeQuotes(str) { return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
  </script>
</body>
</html>
